name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: cargo check
        shell: bash
        run: cargo check --all-targets --message-format=short 2>&1 | tee check.log

      - name: Tests
        shell: bash
        run: cargo test --all-targets 2>&1 | tee test.log

      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: cargo clippy --all-targets --message-format=short 2>&1 | tee clippy.log

      # Hosted log downloads are blocked from some environments; post the log tail as a
      # commit comment instead, which is readable through the REST API.
      - name: Publish diagnostics
        if: failure()
        shell: bash
        run: |
          FILES=$(ls -1 check.log test.log clippy.log 2>/dev/null || true)
          {
            echo "### CI diagnostics for $GITHUB_SHA"
            for f in $FILES; do
              echo ""
              echo "#### $f ($(wc -c < "$f") bytes)"
              echo '```'
              grep -nE "error|warning:|FAILED|panicked|left:|right:|assertion" "$f" | head -120 || true
              echo '```'
            done
          } > /tmp/diag.md
          python3 - <<'PY'
          import json, os, urllib.request
          body = open("/tmp/diag.md", errors="replace").read()[:60000]
          url = os.environ["GITHUB_API_URL"] + "/repos/" + os.environ["GITHUB_REPOSITORY"] + "/commits/" + os.environ["GITHUB_SHA"] + "/comments"
          req = urllib.request.Request(url, method="POST",
              data=json.dumps({"body": body}).encode(),
              headers={"Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
                       "Accept": "application/vnd.github+json",
                       "Content-Type": "application/json"})
          try:
              urllib.request.urlopen(req)
              print("posted diagnostics as a commit comment")
          except Exception as e:
              print("could not post comment:", e)
          PY

  smoke:
    name: end-to-end (real Actix build via rusturbo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build rusturbo
        shell: bash
        run: cargo build --release --message-format=short 2>&1 | tee build.log

      - name: init the demo project
        working-directory: demo/actix-hello
        run: ../../target/release/rusturbo init --preset actix

      - name: analyze
        working-directory: demo/actix-hello
        run: ../../target/release/rusturbo analyze --output /tmp/analyze.json --json

      - name: capture environment
        working-directory: demo/actix-hello
        shell: bash
        run: |
          echo "CARGO_HOME=${CARGO_HOME:-unset}"; echo "RUSTUP_HOME=${RUSTUP_HOME:-unset}"
          ls -la; cat rusturbo.toml || true
          which cargo rustc; cargo --version; rustc -vV | head -3
          echo '--- raw cargo build (no rusturbo) ---'
          cargo build --profile dev 2>&1 | tail -5 || echo "raw cargo build failed rc=$?"

      - name: build through rusturbo (cold turbo cache)
        working-directory: demo/actix-hello
        shell: bash
        run: |
          set -o pipefail
          {
            echo "### rusturbo dry run"
            ../../target/release/rusturbo build --explain --dry-run 2>&1 || true
            echo "### rusturbo build (real)"
            ../../target/release/rusturbo build --explain 2>&1 || echo "BUILD_FAILED rc=$?"
          } > /tmp/turbo.log 2>&1
          cat /tmp/turbo.log
          if grep -q "BUILD_FAILED" /tmp/turbo.log; then
            python3 - <<'PY'
          text = open("/tmp/turbo.log", errors="replace").read()
          payload = " | ".join(text.splitlines()[-80:]).replace("%", "%25")[:6000]
          print(f"::error title=turbo-output::{payload}")
          PY
            exit 1
          fi

      - name: analyze again (expects a cache hit)
        working-directory: demo/actix-hello
        shell: bash
        run: |
          ../../target/release/rusturbo analyze | tee /tmp/analyze2.txt
          grep -Eq "cache hit" /tmp/analyze2.txt

      - name: start the server and hit it
        working-directory: demo/actix-hello
        shell: bash
        run: |
          set -euo pipefail
          BIN=$(ls -d "$HOME"/.cache/rusturbo/shared/*/debug/actix-hello 2>/dev/null | head -1 || true)
          if [ -z "${BIN:-}" ]; then BIN=target/debug/actix-hello; fi
          echo "running $BIN"
          PORT=18080 "$BIN" > /tmp/server.log 2>&1 &
          SERVER_PID=$!
          for _ in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:18080/health > /tmp/health.json 2>/dev/null; then break; fi
            sleep 0.2
          done
          cat /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
          kill "$SERVER_PID"

      - name: benchmark (warm scenarios; cold download is opt-in)
        working-directory: demo/actix-hello
        run: ../../target/release/rusturbo benchmark --scenarios cargo-warm-registry,rusturbo-warm --out bench

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-report
          path: demo/actix-hello/bench/report.*

      - name: Surface diagnostics
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          if os.path.exists("build.log"):
              lines = open("build.log", errors="replace").read().splitlines()
              keep, capture = [], 0
              for ln in lines:
                  if ln.startswith("error") or "error[" in ln:
                      capture = 12
                  if capture > 0:
                      keep.append(ln); capture -= 1
              msg = "%0A".join(keep[-200:]).replace("%", "%25")[:6000]
              if msg:
                  print(f"::error title=build.log::{msg}")
          PY

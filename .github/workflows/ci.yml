name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: cargo check
        shell: bash
        run: cargo check --all-targets --message-format=short 2>&1 | tee check.log

      - name: Tests
        shell: bash
        run: cargo test --all-targets 2>&1 | tee test.log

      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: cargo clippy --all-targets --message-format=short 2>&1 | tee clippy.log

      # GitHub-hosted log downloads are not reachable from some environments; surface
      # compiler diagnostics as check-run annotations instead, which are.
      - name: Surface diagnostics
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import os

          def blocks(lines):
              """Group diagnostic-looking lines into chunks that fit an annotation."""
              keep, chunk, size, out = [], [], 0, []
              for ln in lines:
                  hot = (": error" in ln or ": warning:" in ln or ln.startswith("error")
                         or ln.startswith("warning:") or "panicked at" in ln
                         or "FAILED" in ln or "left:" in ln or "right:" in ln)
                  if hot:
                      if size + len(ln) > 2800:
                          out.append(chunk); chunk, size = [], 0
                      chunk.append(ln)
                      size += len(ln) + 1
              if chunk:
                  out.append(chunk)
              return out

          for log in ("check.log", "test.log", "clippy.log", "build.log",
                      "/tmp/dryrun.log", "/tmp/build-turbo.log", "/tmp/server.log"):
              if not os.path.exists(log):
                  continue
              groups = blocks(open(log, errors="replace").read().splitlines())
              for i, g in enumerate(groups[:10]):
                  msg = "\n".join(g).replace("%", "%25").replace("\r", "")
                  print(f"::error title={log} ({i+1}/{len(groups)})::{msg}")
          PY

  smoke:
    name: end-to-end (real Actix build via rusturbo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build rusturbo
        shell: bash
        run: cargo build --release --message-format=short 2>&1 | tee build.log

      - name: init the demo project
        working-directory: demo/actix-hello
        run: ../../target/release/rusturbo init --preset actix

      - name: analyze
        working-directory: demo/actix-hello
        run: ../../target/release/rusturbo analyze --output /tmp/analyze.json --json

      - name: capture environment
        working-directory: demo/actix-hello
        shell: bash
        run: |
          echo "CARGO_HOME=${CARGO_HOME:-unset}"; echo "RUSTUP_HOME=${RUSTUP_HOME:-unset}"
          ls -la; cat rusturbo.toml || true
          which cargo rustc; cargo --version; rustc -vV | head -3
          echo '--- raw cargo build (no rusturbo) ---'
          cargo build --profile dev 2>&1 | tail -5 || echo "raw cargo build failed rc=$?"

      - name: build through rusturbo (cold turbo cache)
        working-directory: demo/actix-hello
        shell: bash
        run: |
          set -o pipefail
          annotate() {
            python3 - "$1" <<'PY'
          import sys
          lines = open(sys.argv[1], errors="replace").read().splitlines()
          payload = "\n".join(lines[-60:]).replace("%", "%25")[:6000]
          print(f"::error title=turbo-output::{payload}")
          PY
          }
          if ! ../../target/release/rusturbo build --explain --dry-run > /tmp/dryrun.log 2>&1; then
            cat /tmp/dryrun.log; annotate /tmp/dryrun.log; exit 1
          fi
          echo "--- dry run (always annotated for visibility) ---"
          annotate /tmp/dryrun.log
          if ! ../../target/release/rusturbo build --explain > /tmp/build-turbo.log 2>&1; then
            cat /tmp/build-turbo.log; annotate /tmp/build-turbo.log; exit 1
          fi
          echo "--- dry-run ---"; tail -25 /tmp/dryrun.log
          echo "--- build ---"; tail -25 /tmp/build-turbo.log

      - name: analyze again (expects a cache hit)
        working-directory: demo/actix-hello
        shell: bash
        run: |
          ../../target/release/rusturbo analyze | tee /tmp/analyze2.txt
          grep -Eq "cache hit" /tmp/analyze2.txt

      - name: start the server and hit it
        working-directory: demo/actix-hello
        shell: bash
        run: |
          set -euo pipefail
          BIN=$(ls -d "$HOME"/.cache/rusturbo/shared/*/debug/actix-hello 2>/dev/null | head -1 || true)
          if [ -z "${BIN:-}" ]; then BIN=target/debug/actix-hello; fi
          echo "running $BIN"
          PORT=18080 "$BIN" > /tmp/server.log 2>&1 &
          SERVER_PID=$!
          for _ in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:18080/health > /tmp/health.json 2>/dev/null; then break; fi
            sleep 0.2
          done
          cat /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
          kill "$SERVER_PID"

      - name: benchmark (warm scenarios; cold download is opt-in)
        working-directory: demo/actix-hello
        run: ../../target/release/rusturbo benchmark --scenarios cargo-warm-registry,rusturbo-warm --out bench

      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: demo/actix-hello/bench/report.*

      - name: Surface diagnostics
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          if os.path.exists("build.log"):
              lines = open("build.log", errors="replace").read().splitlines()
              keep, capture = [], 0
              for ln in lines:
                  if ln.startswith("error") or "error[" in ln:
                      capture = 12
                  if capture > 0:
                      keep.append(ln); capture -= 1
              msg = "%0A".join(keep[-200:]).replace("%", "%25")[:6000]
              if msg:
                  print(f"::error title=build.log::{msg}")
          PY

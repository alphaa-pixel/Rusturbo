name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross linker (linux arm64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.target }} -p rusturbo

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            BIN="target/${{ matrix.target }}/release/rusturbo.exe"
            OUT="rusturbo-${{ matrix.target }}.exe"
          else
            BIN="target/${{ matrix.target }}/release/rusturbo"
            OUT="rusturbo-${{ matrix.target }}"
          fi
          cp "$BIN" "$OUT"
          (command -v sha256sum >/dev/null && sha256sum "$OUT" > "$OUT.sha256") || shasum -a 256 "$OUT" > "$OUT.sha256"
          cat "$OUT.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: rusturbo-${{ matrix.target }}
          path: |
            rusturbo-${{ matrix.target }}*
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true

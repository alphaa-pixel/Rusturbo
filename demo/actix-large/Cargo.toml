[package]
name = "actix-large"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone project: kept out of the RustTurbo workspace so its (deliberately large)
# dependency graph never slows down `cargo test` for the tool itself.
[workspace]

[dependencies]
actix-web = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Heavy but realistic Actix stack: database driver + migrations + TLS-free HTTP client.
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio", "postgres", "macros", "chrono", "uuid"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
thiserror = "1"
anyhow = "1"

[[bin]]
name = "actix-large"
path = "src/main.rs"
